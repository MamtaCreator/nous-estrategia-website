name: Deploy NOUS Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Angular 22 refuses to build on anything below Node 22.22.3, which is what the run on 20 failed
          # on. package.json now declares the same floor, so npm reports a mismatch before the build does.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required for the deploy job; it no longer feeds the build, see below.
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # The site is served from the custom domain nousestrategia.com, which means it lives at the domain
      # root, so the base href is "/".
      #
      # This is deliberately not taken from configure-pages: its base_path output reports
      # "/nous-estrategia-website" even when a custom domain is configured, and building with that made
      # the browser look for every script under nousestrategia.com/nous-estrategia-website/, which does
      # not exist - the page loaded and rendered nothing.
      #
      # If the custom domain is ever removed, this has to become "/nous-estrategia-website/" instead.
      - name: Build Angular application
        run: npm run build -- --configuration production --base-href "/"

      - name: Add a fallback for client-side routes
        # GitHub Pages serves files, so it knows nothing about the app's routes: opening or refreshing any
        # address other than the home page returns its 404 page. Serving the app from 404.html as well
        # makes those addresses load the site instead.
        run: cp dist/nous-app/browser/index.html dist/nous-app/browser/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular writes the site into a browser/ subfolder.
          path: ./dist/nous-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
