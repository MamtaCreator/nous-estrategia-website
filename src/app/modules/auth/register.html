<div class="auth-page">
  <form appAutofillSync class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1>NOUS Estrategia</h1>
    <p class="subtitle">Create your account and your organization</p>

    <label>
      <span>Organization name</span>
      <input type="text" formControlName="organizationName" autocomplete="organization" placeholder="Acme Consulting" />
      <span class="hint">Your company. Its clients and data stay private to the people you invite.</span>
      <app-field-error [control]="form.controls.organizationName" [messages]="organizationMessages" />
    </label>

    <label>
      <span>Full name</span>
      <input type="text" formControlName="name" autocomplete="name" placeholder="Jane Doe" />
      <app-field-error [control]="form.controls.name" [messages]="nameMessages" />
    </label>

    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="you@company.com" />
      <app-field-error [control]="form.controls.email" [messages]="emailMessages" />
    </label>

    <label>
      <span>Password</span>
      <span class="pw">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
        <button type="button" class="toggle" (click)="showPassword.set(!showPassword())" [attr.aria-pressed]="showPassword()">
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </span>
      <ul class="rules" aria-label="Password requirements">
        @for (r of checklist(); track r.label) {
          <li [class.ok]="r.ok"><span aria-hidden="true">{{ r.ok ? '✓' : '○' }}</span> {{ r.label }}</li>
        }
      </ul>
      <app-field-error [control]="form.controls.password" [messages]="passwordMessages" />
    </label>

    <label>
      <span>Confirm password</span>
      <input [type]="showPassword() ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
      <app-field-error [control]="form.controls.confirmPassword" [messages]="confirmMessages" [watch]="form" [extra]="mismatch()" />
    </label>

    <button type="submit" class="primary" [disabled]="isLoading()">
      {{ isLoading() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="footnote">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
